<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrapbook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Musik -->
<audio id="music" autoplay loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<!-- Love -->
<div class="hearts">
  <span></span><span></span><span></span>
</div>

<!-- Book -->
<div class="book" id="book">

  <div class="page active">
    <div class="text">Teks kamu 1</div>
    <img src="img1.jpg">
  </div>

  <div class="page">
    <div class="text">Teks kamu 2</div>
    <img src="img2.jpg">
  </div>

  <div class="page">
    <div class="text">Teks kamu 3</div>
    <img src="img3.jpg">
  </div>

  <div class="page">
    <div class="text">Teks kamu 4</div>
    <img src="img4.jpg">
  </div>

  <div class="page">
    <div class="text">Teks kamu 5</div>
    <img src="img5.jpg">
  </div>

  <div class="page">
    <div class="text">Teks kamu 6</div>
    <img src="img6.jpg">
  </div>

  <div class="page">
    <div class="text">Teks kamu 7</div>
    <img src="img7.jpg">
  </div>

  <div class="page">
    <div class="text">Teks kamu 8</div>
    <img src="img8.jpg">
  </div>

  <div class="page">
    <div class="text">Teks kamu 9</div>
    <img src="img9.jpg">
  </div>

  <div class="page">
    <div class="text ending">Jadi Kekasihku Saja ❤️</div>
    <img src="img10.jpg">
  </div>

</div>

<!-- tombol -->
<div class="nav">
  <button onclick="prev()">‹</button>
  <button onclick="next()">›</button>
</div>

<script>
let current = 0;
const pages = document.querySelectorAll('.page');

function showPage(index){
  pages.forEach(p => p.classList.remove('active'));
  pages[index].classList.add('active');
}

function next(){
  if(current < pages.length - 1){
    current++;
    showPage(current);
  }
}

function prev(){
  if(current > 0){
    current--;
    showPage(current);
  }
}

/* biar musik jalan setelah klik pertama (anti blok HP) */
document.body.addEventListener('click', () => {
  document.getElementById('music').play();
}, { once: true });
</script>

</body>
</html>
