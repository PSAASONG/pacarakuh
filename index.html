<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrapbook</title>

<!-- LIBRARY -->
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body {
  margin: 0;
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: sans-serif;
}

/* BOOK */
#book {
  width: 90%;
  max-width: 800px;
  height: 500px;
}

/* PAGE */
.page {
  background: #1e1e1e;
  color: white;
  padding: 20px;
  box-sizing: border-box;
  border-radius: 10px;
}

/* CONTENT */
.content {
  display: flex;
  gap: 20px;
  height: 100%;
  align-items: center;
}

.text {
  width: 50%;
  color: #aefcff;
  font-size: 18px;
}

img {
  width: 50%;
  border-radius: 10px;
}

/* END */
.end {
  font-size: 28px;
  color: #ff7aa2;
  text-align: center;
}

/* LOVE */
.hearts span {
  position: fixed;
  bottom: -20px;
  width: 10px;
  height: 10px;
  background: red;
  transform: rotate(45deg);
  animation: float 8s linear infinite;
  opacity: 0.5;
}

.hearts span::before,
.hearts span::after {
  content:'';
  position:absolute;
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
}

.hearts span::before { top:-5px; }
.hearts span::after { left:-5px; }

@keyframes float {
  0% { transform: translateY(0) rotate(45deg);}
  100% { transform: translateY(-110vh) rotate(45deg);}
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<div class="hearts">
  <span style="left:20%"></span>
  <span style="left:40%"></span>
  <span style="left:60%"></span>
  <span style="left:80%"></span>
</div>

<div id="book">

  <div class="page"><div class="content"><div class="text">Kata kamu 1</div><img src="img1.jpg"></div></div>
  <div class="page"><div class="content"><div class="text">Kata kamu 2</div><img src="img2.jpg"></div></div>
  <div class="page"><div class="content"><div class="text">Kata kamu 3</div><img src="img3.jpg"></div></div>
  <div class="page"><div class="content"><div class="text">Kata kamu 4</div><img src="img4.jpg"></div></div>
  <div class="page"><div class="content"><div class="text">Kata kamu 5</div><img src="img5.jpg"></div></div>
  <div class="page"><div class="content"><div class="text">Kata kamu 6</div><img src="img6.jpg"></div></div>
  <div class="page"><div class="content"><div class="text">Kata kamu 7</div><img src="img7.jpg"></div></div>
  <div class="page"><div class="content"><div class="text">Kata kamu 8</div><img src="img8.jpg"></div></div>
  <div class="page"><div class="content"><div class="text">Kata kamu 9</div><img src="img9.jpg"></div></div>
  <div class="page"><div class="end">Jadi Kekasihku Saja ❤️</div></div>

</div>

<script>
const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: 400,
    height: 500,
    size: "stretch",
    minWidth: 300,
    maxWidth: 800,
    showCover: true,
    mobileScrollSupport: false
  }
);

pageFlip.loadFromHTML(document.querySelectorAll(".page"));

/* autoplay setelah interaksi */
document.body.addEventListener('click', () => {
  document.getElementById('music').play();
}, { once: true });
</script>

</body>
</html>
