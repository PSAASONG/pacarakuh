<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrapbook Checkbox Flip</title>
<style>
body {
  margin: 0;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: sans-serif;
  overflow: hidden;
}

/* BOOK CONTAINER */
#book {
  width: 90%;
  max-width: 700px;
  height: 500px;
  position: relative;
  perspective: 1500px;
}

/* HIDE CHECKBOX */
#book input {
  display: none;
}

/* PAGE */
.page {
  width: 100%;
  height: 100%;
  position: absolute;
  transform-style: preserve-3d;
  transition: transform 0.8s ease;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  background: pink;
  z-index: 0;
}

/* FLIPPED STATE */
#book input:checked + .page {
  transform: rotateY(-180deg);
  z-index: -1;
}

/* FRONT & BACK */
.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}

.back {
  transform: rotateY(180deg);
}

/* CONTENT LAYOUT */
.content {
  display: flex;
  width: 100%;
  height: 100%;
}

.text {
  width: 50%;
  color: white;
  font-size: 2em;
  display: flex;
  align-items: center;
  justify-content: center;
}

img {
  width: 50%;
  border-radius: 10px;
}

/* LOVE PARTICLE */
.hearts span {
  position: fixed;
  bottom: -20px;
  width: 10px;
  height: 10px;
  background: red;
  transform: rotate(45deg);
  animation: float 8s linear infinite;
  opacity: 0.5;
  border-radius: 50%;
}

.hearts span::before,
.hearts span::after {
  content:'';
  position:absolute;
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
}

.hearts span::before { top:-5px; }
.hearts span::after { left:-5px; }

@keyframes float {
  0% { transform: translateY(0) rotate(45deg);}
  100% { transform: translateY(-110vh) rotate(45deg);}
}
</style>
</head>
<body>

<audio id="music" loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<div class="hearts">
  <span style="left:20%"></span>
  <span style="left:40%"></span>
  <span style="left:60%"></span>
  <span style="left:80%"></span>
</div>

<div id="book">

  <!-- PAGE 1 -->
  <input type="checkbox" id="one">
  <div class="page">
    <div class="front">
      <div class="content">
        <div class="text">Kata kamu 1</div>
        <img src="img1.jpg">
      </div>
    </div>
    <div class="back">
      <div class="content">
        <div class="text">Kata kamu 2</div>
        <img src="img2.jpg">
      </div>
    </div>
    <label for="one" style="position:absolute;width:100%;height:100%;top:0;left:0;cursor:pointer;"></label>
  </div>

  <!-- PAGE 2 -->
  <input type="checkbox" id="two">
  <div class="page">
    <div class="front">
      <div class="content">
        <div class="text">Kata kamu 3</div>
        <img src="img3.jpg">
      </div>
    </div>
    <div class="back">
      <div class="content">
        <div class="text">Kata kamu 4</div>
        <img src="img4.jpg">
      </div>
    </div>
    <label for="two" style="position:absolute;width:100%;height:100%;top:0;left:0;cursor:pointer;"></label>
  </div>

  <!-- PAGE 3 -->
  <input type="checkbox" id="three">
  <div class="page">
    <div class="front">
      <div class="content">
        <div class="text">Kata kamu 5</div>
        <img src="img5.jpg">
      </div>
    </div>
    <div class="back">
      <div class="content">
        <div class="text">Jadi Kekasihku Saja ❤️</div>
        <img src="img10.jpg">
      </div>
    </div>
    <label for="three" style="position:absolute;width:100%;height:100%;top:0;left:0;cursor:pointer;"></label>
  </div>

</div>

<script>
// Musik autoplay fix
document.body.addEventListener('click', ()=>{document.getElementById('music').play();},{once:true});
</script>
</body>
</html>
